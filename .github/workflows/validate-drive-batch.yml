name: Validate Bollywood Drive 30 Batch
on:
  push:
    paths:
      - 'shorts/drive_batch.py'
      - 'tests/test_drive_batch.py'
      - '.github/workflows/validate-drive-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_drive_batch.py' -v
