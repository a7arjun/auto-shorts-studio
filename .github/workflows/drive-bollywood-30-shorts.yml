name: Bollywood Drive Shorts - 30 Video Batch
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [connection_test, private_test, public_one]
        default: connection_test
permissions:
  contents: write
concurrency:
  group: bollywood-drive-30-single-flight
  cancel-in-progress: false
jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YT_HI_CLIENT_ID: ${{ secrets.YT_HI_CLIENT_ID }}
      YT_HI_CLIENT_SECRET: ${{ secrets.YT_HI_CLIENT_SECRET }}
      YT_HI_REFRESH_TOKEN: ${{ secrets.YT_HI_REFRESH_TOKEN }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_SOURCE_FILE_IDS: ${{ secrets.GDRIVE_SOURCE_FILE_IDS }}
      BOLLYWOOD_PUBLIC_ENABLED: "true"
      BOLLYWOOD_RIGHTS_CONFIRMED: "true"
      BOLLYWOOD_PRIVATE_TEST_VERIFIED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google packages
        run: python -m pip install -r requirements.txt
      - name: Set safe mode
        id: mode
        env:
          REQUESTED: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            mode="${REQUESTED:-connection_test}"
          elif [[ "$BOLLYWOOD_PUBLIC_ENABLED" == "true" && "$BOLLYWOOD_RIGHTS_CONFIRMED" == "true" && "$BOLLYWOOD_PRIVATE_TEST_VERIFIED" == "true" ]]; then
            mode=public_one
          else
            mode=skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"
      - name: Verify private Drive files
        if: steps.mode.outputs.mode == 'connection_test'
        run: python -m shorts.drive_batch --mode check
      - name: Install movie editing and transcription tools
        if: steps.mode.outputs.mode == 'private_test' || steps.mode.outputs.mode == 'public_one'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install 'faster-whisper>=1.1,<2'
      - name: Prepare scene and reserve timeline
        if: steps.mode.outputs.mode == 'private_test' || steps.mode.outputs.mode == 'public_one'
        env:
          REQUESTED: ${{ steps.mode.outputs.mode }}
        run: |
          if [[ "$REQUESTED" == private_test ]]; then
            python -m shorts.drive_batch --mode private
          else
            python -m shorts.drive_batch --mode public
          fi
          test -s output/drive-batch/job.json
          test -s output/drive-batch/short.mp4
      - name: Commit reservation
        if: steps.mode.outputs.mode == 'private_test' || steps.mode.outputs.mode == 'public_one'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/drive_publish_state.json
          git diff --cached --quiet || (git commit -m 'Reserve Bollywood scene' && git pull --rebase && git push origin HEAD:main)
      - name: Upload one video
        if: steps.mode.outputs.mode == 'private_test' || steps.mode.outputs.mode == 'public_one'
        run: python -m shorts.drive_batch --mode upload
      - name: Record successful upload
        if: steps.mode.outputs.mode == 'private_test' || steps.mode.outputs.mode == 'public_one'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/drive_publish_state.json
          git diff --cached --quiet || (git commit -m 'Record uploaded Bollywood Short' && git pull --rebase && git push origin HEAD:main)
