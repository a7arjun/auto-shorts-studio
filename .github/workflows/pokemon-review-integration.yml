name: Pokemon Review Schedule Integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pokemon-review-integration.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokemon-channel-single-flight
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YT_HI_CLIENT_ID: ${{ secrets.YT_HI_CLIENT_ID }}
      YT_HI_CLIENT_SECRET: ${{ secrets.YT_HI_CLIENT_SECRET }}
      YT_HI_REFRESH_TOKEN: ${{ secrets.YT_HI_REFRESH_TOKEN }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      ONNX_PROVIDER: CPUExecutionProvider
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pokemon.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install integration-test rendering and speech tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
          fi
          python -m pip install --prefer-binary --disable-pip-version-check -r requirements-pokemon.txt
          npm ci --omit=optional
      - uses: actions/cache@v4
        with: {path: .cache/kokoro, key: kokoro-onnx-v1-voice-files-1}
      - uses: actions/cache@v4
        with:
          path: .cache/pokemon-images
          key: pokemon-images-v1-${{ github.run_id }}
          restore-keys: pokemon-images-v1-
      - name: Validate updated mechanics and publication guards
        run: |
          python -m pytest -q
          node --test pokemon/simulate.test.cjs
      - name: Verify full-turn v3 presentation and replacement release schedules
        run: |
          python -u - <<'PYREVIEW'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from shorts.pokemon_main import run
          from shorts.pokemon_publish import require_review_deadline
          config=json.loads(Path('data/pokemon_channel.json').read_text())
          # Fixed date makes retries idempotent; this is not recurring production.
          stage_date='2026-10-23'
          pairs={'10:00':('Charizard','Tyranitar'),'22:00':('Charizard','Garchomp')}
          for clock in config['publish_times_ist']:
              target=datetime.fromisoformat(stage_date+'T'+clock+':00').replace(tzinfo=ZoneInfo('Asia/Kolkata'))
              stamp=target.astimezone(timezone.utc).isoformat().replace('+00:00','Z')
              require_review_deadline(config,stamp)
              run('daily',requested_slot={'slot':target.isoformat(timespec='minutes'),
                  'date':stage_date,'publish_at':stamp},requested_pair=pairs[clock])
          PYREVIEW
      - name: Save private integration-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-review-test-${{ github.run_id }}
          path: output/pokemon/
          retention-days: 2
          if-no-files-found: warn
