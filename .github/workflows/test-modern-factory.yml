name: Test Modern Bollywood Short Factory
on:
  push:
    paths:
      - '.github/workflows/test-modern-factory.yml'
      - 'shorts/modern_factory.py'
      - 'shorts/seo.py'
      - 'tests/test_upload_package.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install -r requirements.txt
      - name: Test the authorized-source and SEO gates
        run: python -m unittest discover -s tests -p 'test_upload_package.py' -v
      - name: Render synthetic captioned Short
        run: python -m shorts.modern_factory --demo
      - name: Archive result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-captioned-demo
          path: |
            output/modern-demo/bollywood_short.mp4
            output/modern-demo/render_report.json
            output/modern-demo/captions.srt
            output/modern-demo/upload_package.json
            output/modern-demo/example_film_seo_only.json
          if-no-files-found: warn
          retention-days: 3
