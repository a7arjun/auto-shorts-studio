name: English Pokemon Battle Shorts
on:
  push:
    branches: [main]
    paths:
      - 'pokemon/**'
      - 'assets/pokemon/**'
      - 'shorts/pokemon_*.py'
      - 'tests/test_pokemon*.py'
      - 'requirements-pokemon.txt'
      - 'package*.json'
      - '.github/workflows/pokemon-shorts.yml'
  schedule:
    - cron: '47 12 * * *' # 18:17 IST; GitHub may delay scheduled jobs.
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, connection check, one-time private pilot or daily public job
        type: choice
        options: [preview, probe, pilot, daily]
        default: preview
permissions:
  contents: write
concurrency:
  group: pokemon-channel-single-flight
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.operation.outputs.mode }}
      skip: ${{ steps.operation.outputs.skip }}
      runner: ${{ steps.operation.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Select operation and appropriate runner
        id: operation
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.mode }}
        run: |
          python3 - <<'PYPLAN'
          import json,os
          config=json.load(open('data/pokemon_channel.json'))
          event=os.environ['EVENT']
          mode='preview' if event=='push' else ('daily' if event=='schedule' else os.getenv('REQUESTED','preview'))
          production=mode=='daily'
          skip=production and not config['publication_enabled']
          runner=['self-hosted','linux','pokemon-renderer'] if production else ['ubuntu-latest']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'mode={mode}\nskip={str(skip).lower()}\nrunner={json.dumps(runner)}\n')
          print('Operation:',mode,'; disabled publication:',skip)
          PYPLAN
  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 25
    env:
      YT_HI_CLIENT_ID: ${{ secrets.YT_HI_CLIENT_ID }}
      YT_HI_CLIENT_SECRET: ${{ secrets.YT_HI_CLIENT_SECRET }}
      YT_HI_REFRESH_TOKEN: ${{ secrets.YT_HI_REFRESH_TOKEN }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      ONNX_PROVIDER: CPUExecutionProvider
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pokemon.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install free rendering and speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install -r requirements-pokemon.txt
          npm ci --omit=optional
      - name: Validate mechanics, metadata and publishing guards
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-onnx-v1-voice-files-1
      - name: Generate and run selected operation
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: python -m shorts.pokemon_main --mode "$MODE"
      - name: Save prototype, battle evidence and connection result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-pokemon-pilot-${{ github.run_id }}
          path: output/pokemon/
          retention-days: 2
          if-no-files-found: warn
