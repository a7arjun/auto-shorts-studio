name: Test Real Film Clip (No Upload)
on:
  push:
    paths:
      - .github/workflows/test-real-film.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-film-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements.txt
      - name: Fetch actual One Week movie scene and render 10-second clip
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from shorts.commons_media import download_commons
          from shorts.movie_clips import render_clip,make_metadata
          catalog=json.loads(Path('data/movie_sources.json').read_text())
          item=next(x for x in catalog['english'] if x['id']=='keaton-one-week-scene-1920')
          source,rights=download_commons(item,'.cache/movie_sources')
          print('DOWNLOADED:',source,'bytes:',source.stat().st_size)
          output=render_clip(source,'output/english/real_one_week_10s.mp4',0,10,keep_audio=False)
          print('REAL MOVIE RENDER SUCCESS:',output,output.stat().st_size)
          print('SOURCE:',rights['page'])
          Path('output/english/rights.json').write_text(json.dumps(rights,indent=2))
          PY
      - name: Upload real-video test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-film-test
          path: output/english/
          if-no-files-found: warn
          retention-days: 2
