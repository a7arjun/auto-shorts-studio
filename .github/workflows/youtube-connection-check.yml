name: YouTube Connection Check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/youtube-connection-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install connection-check dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify renewed authorization and channel ownership without uploading
        env:
          YT_HI_CLIENT_ID: ${{ secrets.YT_HI_CLIENT_ID }}
          YT_HI_CLIENT_SECRET: ${{ secrets.YT_HI_CLIENT_SECRET }}
          YT_HI_REFRESH_TOKEN: ${{ secrets.YT_HI_REFRESH_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          from shorts.pokemon_publish import services
          try:
              config=json.loads(Path('data/pokemon_channel.json').read_text())
              _,_,info=services(config)
              if not info['can_manage']:
                  raise RuntimeError('Management scope missing; authorize youtube.force-ssl')
          except Exception as error:
              # Exception URLs can carry API credentials; never print raw errors.
              message='Connection check failed: '+type(error).__name__
              if 'invalid_grant' in str(error):
                  message+='; Google rejected the refresh token. Check the token and matching OAuth client.'
              elif isinstance(error,RuntimeError):
                  message+='; '+str(error)
              print(message)
              sys.exit(1)
          print('AUTHORIZATION VERIFIED: correct destination and video-management scope.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## YouTube authorization verified\n\n')
              summary.write('Channel ID: `'+info['channel_id']+'`\n\n')
              summary.write('OAuth refresh, channel ownership and video-management scope passed. No upload was performed. Production remains gated by private-pilot and runner readiness.\n')
          PY
